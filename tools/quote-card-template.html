<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue: #002FA7;
    --pink: #FFC0CB;
    --black: #222222;
    --burgundy: #800020;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: var(--black);
    font-family: "Cormorant Garamond", Garamond, serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 90px 100px;
  }
  .kicker {
    font-size: 30px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--burgundy);
    font-weight: 500;
  }
  .quote {
    color: var(--pink);
    font-size: 68px;
    line-height: 1.35;
    font-weight: 300;
    font-style: italic;
  }
  .quote em { font-style: normal; color: #fff; }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: var(--blue);
    font-size: 30px;
    letter-spacing: 0.08em;
  }
  .footer .journal { color: var(--burgundy); font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; font-size: 26px; }
  .footer .author { color: rgba(255,192,203,0.55); font-size: 28px; font-style: italic; }
</style>
</head>
<body>
  <div class="kicker">The Selective Extinction · VI</div>
  <div class="quote" id="q">QUOTE</div>
  <div class="footer">
    <span class="journal">Sulla Soglia · Issue 006</span>
    <span class="author">Chen Ying Claude</span>
  </div>
</body>
</html>
